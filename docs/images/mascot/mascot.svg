      <rect x="22" y="-22" width="16" height="44" rx="3" fill="#2B1D22" stroke-width="3"/>
      <rect x="-48" y="-18" width="10" height="36" rx="2" fill="#C9C2BA" stroke-width="3"/>
      <circle cx="-30" cy="32" r="7" fill="#F26B3A" stroke-width="3"/>
      <circle cx="-10" cy="38" r="6" fill="#F26B3A" stroke-width="3"/>
