<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 520 560" width="520" height="560">
  <title>MC Chops, Amamac's mascot: a pink pig with a handlebar mustache playing an electric guitar</title>
