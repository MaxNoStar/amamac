name: Amamac
options:
  bundleIdPrefix: local.amamac
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ARCHS: arm64
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # Blocks code injection into the app (DYLD_INSERT_LIBRARIES and the like, unsigned code).
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.6"
    CURRENT_PROJECT_VERSION: "7"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      ONLY_ACTIVE_ARCH: YES
    Release:
      # No get-task-allow: other processes may not attach to or inspect the released app.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
packages:
  AmamacKit:
    path: Packages/AmamacKit
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    minorVersion: 3.1.0
  ogg-binary-xcframework:
    url: https://github.com/sbooth/ogg-binary-xcframework
    exactVersion: 0.1.3
  flac-binary-xcframework:
    url: https://github.com/sbooth/flac-binary-xcframework
    exactVersion: 0.2.0
  opus-binary-xcframework:
    url: https://github.com/sbooth/opus-binary-xcframework
    exactVersion: 0.3.0
  vorbis-binary-xcframework:
    url: https://github.com/sbooth/vorbis-binary-xcframework
    exactVersion: 0.1.2
  wavpack-binary-xcframework:
    url: https://github.com/sbooth/wavpack-binary-xcframework
    exactVersion: 0.2.0
  lame-binary-xcframework:
    url: https://github.com/sbooth/lame-binary-xcframework
    exactVersion: 0.1.2
  mpc-binary-xcframework:
    url: https://github.com/sbooth/mpc-binary-xcframework
    exactVersion: 0.1.2
  mpg123-binary-xcframework:
    url: https://github.com/sbooth/mpg123-binary-xcframework
    exactVersion: 0.3.1
  sndfile-binary-xcframework:
    url: https://github.com/sbooth/sndfile-binary-xcframework
    exactVersion: 0.1.2
  tta-cpp-binary-xcframework:
    url: https://github.com/sbooth/tta-cpp-binary-xcframework
    exactVersion: 0.1.2
targets:
  Amamac:
    type: application
    platform: macOS
    sources:
      - Sources/Amamac
      - Resources
      # Amamac's own license travels with every copy of the app (Help › Acknowledgements).
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: AmamacKit
        product: AmamacBase
      - package: AmamacKit
        product: AmamacModels
      - package: AmamacKit
        product: AmamacQuery
      - package: AmamacKit
        product: AmamacDatabase
      - package: AmamacKit
        product: AmamacLibrary
      - package: AmamacKit
        product: AmamacPlaylist
      - package: AmamacKit
        product: AmamacDynamic
      - package: AmamacKit
        product: AmamacPlayback
      - package: AmamacKit
        product: AmamacWeb
      - package: AmamacKit
        product: AmamacPodcasts
      - package: AmamacKit
        product: AmamacTestSupport
      - package: KeyboardShortcuts
      # SFBAudioEngine's codec libraries are dynamic binary frameworks reached only through the
      # AmamacKit package, so embed them in the app explicitly.
      - package: ogg-binary-xcframework
        product: ogg
        embed: false
      - package: flac-binary-xcframework
        product: FLAC
        embed: false
      - package: opus-binary-xcframework
        product: opus
        embed: false
      - package: vorbis-binary-xcframework
        product: vorbis
        embed: false
      - package: wavpack-binary-xcframework
        product: wavpack
        embed: false
      - package: lame-binary-xcframework
        product: lame
        embed: false
      - package: mpc-binary-xcframework
        product: mpc
        embed: false
      - package: mpg123-binary-xcframework
        product: mpg123
        embed: false
      - package: sndfile-binary-xcframework
        product: sndfile
        embed: false
      - package: tta-cpp-binary-xcframework
        product: tta-cpp
        embed: false
    entitlements:
      path: Generated/Amamac.entitlements
      properties:
        # The codec frameworks are ad-hoc signed without a Team ID, which the hardened runtime's
        # library validation rejects. This is the only exception: DYLD_* variables, debugger
        # attach and unsigned executable memory stay blocked.
        com.apple.security.cs.disable-library-validation: true
    info:
      path: Generated/Amamac-Info.plist
      properties:
        CFBundleDisplayName: Amamac
        CFBundleName: Amamac
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "Amamac — a music player inspired by Amarok."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Amamac plays radio streams from your local network.
        CFBundleURLTypes:
          - CFBundleURLName: local.amamac
            CFBundleURLSchemes: [amamac]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
          - CFBundleTypeName: Playlist
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.m3u-playlist, public.playlist, com.apple.mpegurl, public.pls-playlist, public.xspf-playlist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.amamac
        PRODUCT_NAME: Amamac
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        COMBINE_HIDPI_IMAGES: YES
  AmamacKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AmamacKitTests
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: AmamacKit
        product: AmamacBase
      - package: AmamacKit
        product: AmamacModels
      - package: AmamacKit
        product: AmamacQuery
      - package: AmamacKit
        product: AmamacDatabase
      - package: AmamacKit
        product: AmamacLibrary
      - package: AmamacKit
        product: AmamacPlaylist
      - package: AmamacKit
        product: AmamacDynamic
      - package: AmamacKit
        product: AmamacPlayback
      - package: AmamacKit
        product: AmamacWeb
      - package: AmamacKit
        product: AmamacPodcasts
      - package: AmamacKit
        product: AmamacTestSupport
      - package: GRDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: local.amamac.tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/../Frameworks"]
schemes:
  Amamac:
    build:
      targets:
        Amamac: all
        AmamacKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AmamacKitTests
